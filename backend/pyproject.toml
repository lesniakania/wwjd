[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wwjd-api"
version = "0.1.0"
description = "Source-grounded Bible reflection API"
requires-python = ">=3.11"
dependencies = [
  "fastembed>=0.7,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=2.0,<3",
  "pydantic-settings>=2.6,<3",
  "psycopg[binary]>=3.2,<4",
  "scikit-learn>=1.7,<2",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
