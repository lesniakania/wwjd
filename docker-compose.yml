services:
  backend:
    image: wwjd-backend
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://wwjd:secret@db:5432/wwjd
      HF_TOKEN: ${HF_TOKEN:-}
      HF_MODEL: ${HF_MODEL:-Qwen/Qwen3-4B-Instruct-2507}
      HF_MODEL_PL: ${HF_MODEL_PL:-speakleash/Bielik-11B-v3.0-Instruct}
      HF_BASE_URL: ${HF_BASE_URL:-https://router.huggingface.co/v1}
      HF_MAX_TOKENS: ${HF_MAX_TOKENS:-1200}
      HF_TIMEOUT_SECONDS: ${HF_TIMEOUT_SECONDS:-45}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      RERANKER_CANDIDATES: ${RERANKER_CANDIDATES:-50}
    depends_on:
      build-indexes:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/scripts:/app/scripts
      - model-cache:/app/app/data/models

  build-indexes:
    image: wwjd-backend
    build:
      context: ./backend
    command: python scripts/build_indexes.py
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
    volumes:
      - ./backend/app:/app/app
      - ./backend/scripts:/app/scripts
      - ./backend/app/data:/app/app/data
      - model-cache:/app/app/data/models

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-}
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: wwjd
      POSTGRES_USER: wwjd
      POSTGRES_PASSWORD: secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wwjd -d wwjd"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  frontend-node-modules:
  model-cache:
  postgres-data:
