services:
  - type: web
    name: wwjd-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install . && python scripts/build_indexes.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: HF_MODEL
        value: Qwen/Qwen3-4B-Instruct-2507
      - key: HF_MODEL_PL
        value: speakleash/Bielik-11B-v3.0-Instruct
      - key: HF_BASE_URL
        value: https://router.huggingface.co/v1
      - key: HF_MAX_TOKENS
        value: "1200"
      - key: HF_TIMEOUT_SECONDS
        value: "45"
      - key: EMBEDDING_MODEL
        value: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
